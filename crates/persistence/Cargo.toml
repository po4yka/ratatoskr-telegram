[package]
name        = "ratatoskr-telegram-persistence"
description = "The PostgreSQL pool, the embedded telegram schema, and the readiness probe for both."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "telegram_persistence"
path = "src/lib.rs"

# No axum and no telemetry crate: interaction crates depend on this one and must not inherit an HTTP
# server or an exporter to run a query.
[dependencies]
ratatoskr-telegram-core.workspace = true
sqlx.workspace      = true
secrecy.workspace   = true
thiserror.workspace = true
tracing.workspace   = true
tokio.workspace     = true
# App-minted UUIDv7 primary keys for the tables this crate writes (message bindings, outbound
# jobs): the schema deliberately carries no DEFAULT on id columns, so the database cannot mint.
uuid.workspace = true
base64.workspace = true
ratatoskr-github-contracts.workspace = true
# Message payloads cross as jsonb: serde derives the payload struct and serde_json does the
# canonical serialization the content hash covers.
serde.workspace      = true
serde_json.workspace = true

[features]
# The disposable-database harness. Never enabled by a service binary.
test-support = []

[dev-dependencies]
# The suite drives the disposable-database harness through this crate's own public surface, so a
# per-package `cargo test -p ratatoskr-telegram-persistence` enables it itself.
ratatoskr-telegram-persistence = { path = ".", features = ["test-support"] }

[lints]
workspace = true
