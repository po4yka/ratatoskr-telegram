[package]
name        = "ratatoskr-telegram-core"
description = "Runtime role, typed Telegram configuration, and the Telegram error taxonomy."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "telegram_core"
path = "src/lib.rs"

# No axum, no OpenTelemetry, no HTTP server: the persistence and telemetry crates need the error
# types and configuration without serving HTTP or exporting spans.
[dependencies]
figment.workspace      = true
secrecy.workspace      = true
url.workspace          = true
serde.workspace        = true
thiserror.workspace    = true
tracing.workspace      = true
# Used only by validation rule V1, which parses the log filter with `EnvFilter::try_new`.
tracing-subscriber.workspace = true

[dev-dependencies]
# `figment::Jail` is the only supported way to set an environment variable in a test:
# `std::env::set_var` is `unsafe` in edition 2024 and the workspace forbids unsafe code.
figment = { workspace = true, features = ["test"] }
serde_json.workspace = true

[lints]
workspace = true
