[package]
name         = "ratatoskr-telegram-blob-store"
description  = "Telegram-owned content-addressed blob storage following the fleet BlobRef convention."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
# The published BlobRef contract: owner service, digest, media type, length.
ratatoskr-identifiers.workspace = true
# SHA-256 is the fleet's only digest algorithm (`DigestHex` is fixed at sixty-four hex chars).
sha2.workspace        = true
uuid.workspace        = true
serde.workspace       = true
serde_json.workspace  = true
thiserror.workspace   = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tokio.workspace    = true
tempfile.workspace = true

[lints]
workspace = true
