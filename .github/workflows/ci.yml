# The gate DEVELOPMENT.md documents, enforced. The command list here and the command list in
# DEVELOPMENT.md are the same list; if they drift, DEVELOPMENT.md is wrong.
#
# The gate holds no secret at all. Contract git revisions are public and exact; crates.io resolves
# anonymously, while PostgreSQL/NATS use only task-local synthetic credentials and state.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# SECURITY.md: deny by default. The gate reads the tree and needs nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On a pull request the newest push is the only one whose answer matters, and cancelling the
  # superseded run is what makes the queue keep up. On `main` it is the opposite: a cancelled run
  # leaves that commit with no verdict at all, and `main` is the branch whose history is supposed to
  # record whether each commit passed. Two pushes a minute apart would otherwise erase the first
  # one's result permanently — the log is the only place it ever existed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The schema integration test talks to a real PostgreSQL on purpose: `schema.sql` is applied by
    # runtime code under an advisory lock, so the suite is what replaces any compile-time checking
    # and proves the file applies cleanly to a fresh database. Without it the test does not run and
    # the schema is unverified.
    services:
      postgres:
        # Pinned by digest, not by tag. A service container runs on the runner beside the checkout
        # and the build, on the same network, so a compromised `postgres:17` is a path to the crates.io
        # downloads that produce the release binary — the same threat that makes every action here a
        # SHA. This digest is `postgres:17` as it stood on 2026-08-19: PostgreSQL 17.11. It is the
        # multi-architecture index rather than one image, so the pin constrains the version and not the
        # runner. zizmor reports the tag form as `unpinned-images`.
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: telegram
          POSTGRES_PASSWORD: telegram
          POSTGRES_DB: telegram
          # Byte-identical to compose.yaml. Without it this cluster is created with the runner's
          # glibc collation while a developer's is created with ICU, so a text index sorts
          # differently in the two places that are supposed to be checking each other.
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telegram -d telegram"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      # Where the suite creates and drops its disposable databases. Matches compose.yaml, so the
      # same command works on a laptop and here.
      TELEGRAM_TEST_DATABASE_URL: postgres://telegram:telegram@127.0.0.1:5432/telegram
      TELEGRAM_TEST_NATS_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate reads the tree and pushes nothing, so the checkout credential is left behind in
          # .git/config for no reason. Deny by default applies to the token too.
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show           # rust-toolchain.toml is the only supported toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start disposable JetStream for notification-consumer tests
        run: docker run --detach --rm --name telegram-ci-nats --publish 4222:4222 nats@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da --jetstream --store_dir=/data

      - run: cargo fetch --locked

      # Reads RustSec, the licence set, duplicate versions and the source policy. Nothing else in
      # the gate looks at any of them. The sibling services found real advisories this way that
      # neither clippy nor test can see.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny
      - run: cargo deny check

      - run: cargo fmt --all -- --check

      - name: Validate executable operator runbooks
        run: |
          bash -n deploy/bin/telegram-ops deploy/tests/telegram_ops_test.sh
          bash deploy/tests/telegram_ops_test.sh

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The one size limit clippy cannot express. `clippy.toml` bounds a function, a signature and a
      # block; no Rust lint counts the lines in a file, and a module can pass every one of those and
      # still be a god-module. 850 is the fleet's ratchet
      # (ratatoskr-workspace/docs/QUALITY_GATES.md), not a target. `*.rs` only, so `Cargo.lock` and
      # `schema.sql` need no exclusion list — an exclusion list is a second source of truth that
      # goes stale in silence.
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'

      # Before the tests, not after: services/webhook/tests/boot.rs executes
      # ratatoskr-telegram-dispatcher as a child process, and `cargo test` builds the binary of the
      # package under test only — a sibling package's plain binary is never produced by it. Without
      # this step the dispatcher half of the boot test fails on any clean checkout.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release

      # This file and DEVELOPMENT.md are one list by rule, and the rule had no enforcement — the
      # same defect class as a document claiming a capability the tree lacks.
      #
      # The awk is scoped to the `gate` job. Reading the whole file was a latent trap: DEVELOPMENT.md
      # documents THIS job's command list, so the first commit adding a second job with a cargo step
      # would have failed the guard with "DEVELOPMENT.md is the one that is wrong" — pointing the
      # author at the wrong file entirely. A top-level job key is a bare name at two spaces, which
      # is what the first rule tracks.
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust — also the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' \
                   DEVELOPMENT.md)
          if [ "$in_ci" != "$in_doc" ]; then
            echo "::error::ci.yml and DEVELOPMENT.md have drifted. DEVELOPMENT.md is the one that is wrong."
            diff <(echo "$in_ci") <(echo "$in_doc") || true
            exit 1
          fi
          echo "the two lists are identical:"
          echo "$in_ci" | awk '{print "  " $0}'
