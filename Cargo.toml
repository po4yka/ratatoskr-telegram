[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/telemetry",
    "crates/http",
    "crates/persistence",
    "crates/bot-api",
    "crates/platform-api",
    "crates/blob-store",
    "services/webhook",
    "services/dispatcher",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"                       # equals the pinned toolchain; no MSRV promise we cannot check
license      = "BSD-3-Clause"
repository   = "https://github.com/po4yka/ratatoskr-telegram"

[workspace.dependencies]
# ---- in-repo ----
ratatoskr-telegram-core        = { version = "0.1.0", path = "crates/core" }
ratatoskr-telegram-telemetry   = { version = "0.1.0", path = "crates/telemetry" }
ratatoskr-telegram-http        = { version = "0.1.0", path = "crates/http" }
ratatoskr-telegram-persistence = { version = "0.1.0", path = "crates/persistence" }
ratatoskr-telegram-bot-api     = { version = "0.1.0", path = "crates/bot-api" }
ratatoskr-telegram-platform-api = { version = "0.1.0", path = "crates/platform-api" }
ratatoskr-telegram-blob-store  = { version = "0.1.0", path = "crates/blob-store" }

# ---- Ratatoskr fleet contracts ----
# The published BlobRef wire types (`ratatoskr-identifiers`). Pinned by revision exactly like the
# extractor pins the same crate, so every fleet member speaks one contract version; `deny.toml`'s
# `required-git-spec = "rev"` enforces this form.
ratatoskr-identifiers = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9a4df8126b495ffc3ad0647441da1690594f25bc" }
ratatoskr-github-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9a4df8126b495ffc3ad0647441da1690594f25bc" }
ratatoskr-event-envelope = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9a4df8126b495ffc3ad0647441da1690594f25bc" }
ratatoskr-notification-contracts = { git = "https://github.com/po4yka/ratatoskr-contracts.git", rev = "9a4df8126b495ffc3ad0647441da1690594f25bc" }

# ---- Telegram Bot API ----
# The sanctioned client for every Telegram API call this service makes (plan item 2 onward:
# webhook updates, sendMessage/editMessageText delivery). `ratatoskr-telegram-bot-api` is the only
# crate that may depend on it, so the token and the URL shapes that carry it stay in one boundary.
# `default-features = false` drops `native-tls`; `rustls` matches the fleet's TLS posture.
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
# Pinned to the same major teloxide-core builds against, so the two share one connection stack.
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls"] }

# Constant-time secret comparison for the webhook admission gate.
subtle = { version = "2.6.1", default-features = false }

# ---- persistence ----
# No `migrate` feature: the schema is one file, `include_str!`d into the binary by
# `ratatoskr-telegram-persistence`, so a deployment cannot drift from its schema and there is no
# ledger to record.
    sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid"] }

# ---- async runtime and HTTP ----
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
async-nats = { version = "0.50.0", default-features = false, features = ["ring", "jetstream", "nkeys"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
axum  = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
http  = "1.5.0"

# ---- configuration ----
figment = { version = "0.10.19", features = ["env"] }
secrecy = { version = "0.10.3", features = ["serde"] }
url     = { version = "2.5.8", features = ["serde"] }

# ---- telemetry ----
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter", "fmt", "json", "ansi"] }
tracing-opentelemetry = "0.33.0"
opentelemetry         = "0.32.0"
opentelemetry_sdk     = { version = "0.32.1", features = ["rt-tokio", "trace"] }
# The three `tls-*` features are load-bearing, not defensive: without a TLS feature the exporter
# REFUSES to build for an `https://` endpoint, so a configured collector would exit the process at
# startup. `tls-ring` is the crypto provider; the two root sets are the trust anchors.
opentelemetry-otlp          = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "trace", "tls-ring", "tls-roots", "tls-webpki-roots"] }
metrics                     = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# ---- serialization and errors ----
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror  = "2.0.20"

# ---- hashing ----
# sha256 for outbound-job content hashes (identical-render no-op detection); pure-Rust, the
# ecosystem-standard implementation, added for the dispatcher's projection accept step.
sha2 = "0.10.9"

# ---- platform assertions ----
# Ed25519 signing for the short-lived identity assertions this service issues to Platform
# (plan item 5 onward). `ed25519-dalek` is the maintained pure-Rust implementation; the
# verification side lives in Platform under `ring`. `base64` provides the URL_SAFE_NO_PAD
# alphabet the compact token form uses; Platform's verifier shares the engine choice.
# `jiff` matches Platform's timestamp type so claim instants serialize identically.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "zeroize"] }
base64        = "0.22.1"
jiff          = { version = "0.2.15", default-features = false, features = ["std", "serde"] }

# ---- identifiers ----
# `uuid` v7 because ratatoskr-contracts mints v7 and the database stores the same bytes.
# `serde` because Platform wire shapes carry identifiers as JSON values the platform-api
# boundary deserializes directly.
uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }

# ---- dev only ----
tower         = "0.5.3"
http-body-util = "0.1.5"   # also a regular dependency of the webhook intake's capped body reader
tempfile      = "3.20.0"   # per-test blob-store roots; never a regular dependency

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
dbg_macro          = "deny"
todo               = "deny"
print_stdout       = "deny"     # startup failures go to stderr; a stray println bypasses the subscriber
# `panic`, `unwrap_used` and `expect_used` above close every EXPLICIT panic path and leave the most
# common implicit one open. Both of these are `allow` by default and in `clippy::restriction`, so
# `pedantic` does not enable them. Measured at zero violations in the sibling workspaces when
# adopted there.
indexing_slicing   = "deny"     # `v[i]` and `&s[a..b]` panicking out of bounds
string_slice       = "deny"     # `&s[..n]` panicking because n is not a UTF-8 char boundary

# Release profile: `panic` is left at the default `unwind` ON PURPOSE. `panic = "abort"` silently
# disables axum's catch-panic behaviour (`catch_unwind` cannot run) and turns every handler panic
# into a process abort with no log line.
[profile.release]
debug = 1          # line tables only: a usable backtrace in the ERROR log, no full debuginfo
