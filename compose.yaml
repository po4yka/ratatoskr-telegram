# The local development dependencies, matching the defaults the test suite assumes:
# `TELEGRAM_TEST_DATABASE_URL` below is both the suite's database factory and what `DEVELOPMENT.md`
# documents. Start it with `docker compose up -d`, stop it with `docker compose down`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: telegram
      POSTGRES_PASSWORD: telegram
      POSTGRES_DB: telegram
      # Byte-identical to the CI service container, so a text index sorts the same way in the two
      # places that are supposed to be checking each other.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram -d telegram"]
      interval: 1s
      timeout: 5s
      retries: 30
