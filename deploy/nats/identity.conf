# Merge this public-nkey identity into the host NATS `authorization.users` list; the deployed ACL is
# `deploy/nats/ratatoskr.conf` in ratatoskr-platform and this stanza is a byte-equal copy of its
# TELEGRAM entry (XR-021 CONTRACTS.md sections S03 and R3-01). The seed stays in
# `/etc/ratatoskr/telegram.nkey`, named by `RATATOSKR__NOTIFICATION_BUS__CREDENTIALS_FILE`; replace
# only the non-secret public-key placeholder.
#
# The dispatcher consumes the Edge-provisioned durable `ratatoskr_telegram_notifications` and
# publishes nothing else. It subscribes only to its own inbox prefix `_INBOX_telegram`, which the
# service sets with `custom_inbox_prefix` in `services/dispatcher/src/notifications.rs`; a service
# built without the prefix cannot complete a JetStream request under this stanza. A denied publish
# is visible only in the NATS server log as a `Publish Violation`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_TELEGRAM_XXXX
    permissions: {
        publish: {
            allow: [
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_telegram_notifications",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_telegram_notifications",
                "$JS.ACK.ratatoskr_events.ratatoskr_telegram_notifications.>",
            ]
        }
        subscribe: { allow: ["_INBOX_telegram.>"] }
    }
}
