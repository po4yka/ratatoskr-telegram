[package]
name        = "ratatoskr-telegram-dispatcher"
description = "The Telegram dispatcher deployable: projects operations into ordered Bot API sends."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "ratatoskr_telegram_dispatcher"
path = "src/lib.rs"

[[bin]]
name = "ratatoskr-telegram-dispatcher"
path = "src/main.rs"

[dependencies]
ratatoskr-telegram-core.workspace = true
ratatoskr-telegram-http.workspace = true
ratatoskr-telegram-bot-api.workspace = true
ratatoskr-telegram-platform-api.workspace = true
ratatoskr-telegram-persistence.workspace = true
ratatoskr-telegram-telemetry.workspace = true
ratatoskr-event-envelope.workspace = true
ratatoskr-notification-contracts.workspace = true
async-nats.workspace = true
futures-util.workspace = true
jiff.workspace     = true
metrics.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace    = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace     = true
uuid.workspace = true

[dev-dependencies]
ratatoskr-telegram-persistence = { workspace = true, features = ["test-support"] }
axum.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
