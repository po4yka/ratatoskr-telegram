[package]
name        = "ratatoskr-telegram-webhook"
description = "The Telegram webhook deployable: receives Bot API updates and acknowledges fast."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ratatoskr-telegram-webhook"
path = "src/main.rs"

[dependencies]
ratatoskr-telegram-core.workspace = true
ratatoskr-telegram-http.workspace = true
tokio.workspace = true

[dev-dependencies]
ratatoskr-telegram-persistence = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
