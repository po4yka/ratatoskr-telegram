[package]
name        = "ratatoskr-telegram-webhook"
description = "The Telegram webhook deployable: receives Bot API updates and acknowledges fast."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "ratatoskr_telegram_webhook"
path = "src/lib.rs"

[[bin]]
name = "ratatoskr-telegram-webhook"
path = "src/main.rs"

[dependencies]
ratatoskr-telegram-core.workspace        = true
ratatoskr-telegram-http.workspace        = true
ratatoskr-telegram-persistence.workspace = true
ratatoskr-telegram-bot-api.workspace     = true
ratatoskr-telegram-platform-api.workspace = true
ratatoskr-telegram-telemetry.workspace   = true
axum.workspace    = true
http.workspace    = true
http-body-util.workspace = true
jiff.workspace     = true
metrics.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sha2.workspace    = true
subtle.workspace  = true
tokio.workspace   = true
tracing.workspace = true
url.workspace     = true
uuid.workspace    = true

[dev-dependencies]
ratatoskr-telegram-persistence = { workspace = true, features = ["test-support"] }
sqlx.workspace  = true
tower.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
